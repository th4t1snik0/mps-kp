name: code

# Проверка программ КМ-3 (students/<ник>/code/prog{1,2,3}.a51) — только Go: свой ассемблер (asm51) и эмулятор 8051 (emu51),
# ничего не ставится, прогон ~1 мин. Сверка ассемблера с MCU 8051 IDE — отдельная джоба mide, по кнопке (галочка в Run workflow).
#  - push: если менялись программы студентов, чекер, шаблоны или таблица;
#  - Actions → code → Run workflow: можно указать ник (пусто — все студенты).
# Что делает: тесты чекера на эталонах; mpscode по каждому студенту;
# результаты (файлы для робота «Фамилия ИО-код-n.txt», отчёт) — в ветку results (<группа>/<M>/code/), на Яндекс-диск и в артефакт.
on:
  push:
    paths:
      - "students/**"
      - "cmd/mpscode/**"
      - "internal/asm51/**"
      - "internal/emu51/**"
      - "internal/codecheck/**"
      - "internal/variant/**"
      - "internal/render/**"
      - "data/**"
      - "scripts/mide_crosscheck.sh"
      - "scripts/publish.sh"
      - ".github/workflows/code.yml"
  workflow_dispatch:
    inputs:
      student:
        description: "Ник студента (папка в students/); пусто — все"
        required: false
        default: ""
      mide:
        description: "Сверить наш ассемблер с MCU 8051 IDE (apt, +1…10 мин)"
        type: boolean
        default: false

concurrency:
  group: code-${{ github.ref }}-${{ inputs.student }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  code:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Тесты ассемблера, эмулятора и чекера (эталоны проходят, поломки падают)
        run: go test ./internal/asm51/ ./internal/emu51/ ./internal/codecheck/

      - name: Сборка mpscode
        run: go build -o bin/mpscode ./cmd/mpscode

      - name: Программы студентов
        id: students
        env:
          ONLY: ${{ inputs.student }}
        run: |
          status=0
          for f in students/*/variant.yaml; do
            s="$(basename "$(dirname "$f")")"
            [ -n "$ONLY" ] && [ "$s" != "$ONLY" ] && continue
            ls students/"$s"/code/prog[123].a51 >/dev/null 2>&1 || continue
            echo "::group::$s"
            bin/mpscode -student "$f" || status=1
            echo "::endgroup::"
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Результаты → ветка results
        if: github.ref == 'refs/heads/main'
        env:
          SUMMARY: "0"   # сводку уже написал mpscode
        run: find build/ -mindepth 3 -maxdepth 3 -type d -name code -exec dirname {} \; | tr '\n' '\0' | xargs -0 -r scripts/publish.sh

      - name: Результаты → Яндекс-диск (если задан секрет YADISK_TOKEN)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          YADISK_TOKEN: ${{ secrets.YADISK_TOKEN }}
          YADISK_PUBLIC: ${{ vars.YADISK_PUBLIC || 'https://disk.yandex.ru/d/ai0wkudkDT9Tog' }}
        run: find build/ -mindepth 3 -maxdepth 3 -type d -name code -exec dirname {} \; | tr '\n' '\0' | xargs -0 -r python3 scripts/yadisk_upload.py

      - uses: actions/upload-artifact@v4
        with:
          name: code
          path: build/**/code/
          retention-days: 7

      - name: Итог по студентам
        if: steps.students.outputs.status != '0'
        run: |
          echo "::error::в программах студентов есть ❌ — отчёт на странице запуска (Summary) и в build/<группа>/<M>/code/report.md"
          exit 1

  mide:
    # вторая сборка эталонов и программ студентов MCU 8051 IDE — байты должны совпасть с asm51
    if: github.event_name == 'workflow_dispatch' && inputs.mide
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: MCU 8051 IDE
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends mcu8051ide
      - name: Сверка asm51 с MCU 8051 IDE
        run: |
          go build -o bin/mpscode ./cmd/mpscode
          r=internal/codecheck/testdata/ref
          bin/mpscode -outroot build-ref -group А-12 -m 14 -nosim $r/prog1.a51 $r/prog2r.a51 $r/prog3y2.a51 >/dev/null || true
          bin/mpscode -outroot build-ref -group А-12 -m 15 -nosim $r/prog2w.a51 $r/prog3ind.a51 >/dev/null || true
          bin/mpscode -outroot build-ref -group А-17 -m 16 -nosim $r/prog3y1.a51 >/dev/null || true
          for f in students/*/variant.yaml; do
            ls "$(dirname "$f")"/code/prog[123].a51 >/dev/null 2>&1 && bin/mpscode -nosim -student "$f" >/dev/null || true
          done
          scripts/mide_crosscheck.sh build build-ref
