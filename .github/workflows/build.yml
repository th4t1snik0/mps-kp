name: build

# Два режима:
#  - push, только если менялось то, что влияет на результат (код, таблица, символы, студенты…):
#    тесты + сборка всех students/*/variant.yaml. Правки памяти (sessions/, notes/, docs/, *.md) CI не гоняют —
#    раннер каждый раз чистый, и KiCad ставится заново (~1 мин), незачем тратить это на текст;
#  - Actions → build → Run workflow: ввести группу и M — соберётся один вариант
#    (удобно с телефона: результат в артефакте build внизу страницы запуска).
on:
  push:
    paths:
      - "cmd/**"
      - "internal/**"
      - "data/**"
      - "masters/**"
      - "students/**"
      - "fonts/**"
      - "scripts/**"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      group:
        description: "Группа по ТЗ-2026 (А-06, А-07, А-08, А-09, А-12, А-17, Аэ-21)"
        required: false
        default: ""
      m:
        description: "Номер варианта M (1..30)"
        required: false
        default: ""
      fio:
        description: "Фамилия И.О. студента — в рамку (Разраб.)"
        required: false
        default: ""
      checker:
        description: "Фамилия И.О. преподавателя — в рамку (Пров.)"
        required: false
        default: "Михалин С.Н."
      style:
        description: "Стиль листа: A (как Рязанцев 2025), B (Осипова 2025), C (Сорокина 2023), D (Базарнов 2023); пусто — по ФИО"
        required: false
        default: ""
      year:
        description: "Год набора группы: А-12 → А-12-<год>"
        required: false
        default: "23"

# новый пуш отменяет ещё идущий прогон той же ветки; запуски Run workflow с разными вариантами не мешают друг другу
concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}-${{ inputs.group }}-${{ inputs.m }}
  cancel-in-progress: true

permissions:
  contents: write   # публикация результатов в ветку results

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: KiCad 10 + poppler + шрифт ГОСТ
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends kicad poppler-utils
          mkdir -p ~/.fonts && cp fonts/*.ttf ~/.fonts/ && fc-cache -f

      - name: Тесты
        run: go test ./...

      - name: Один вариант (Run workflow)
        if: github.event_name == 'workflow_dispatch' && inputs.group != '' && inputs.m != ''
        env:
          G: ${{ inputs.group }}
          M: ${{ inputs.m }}
          FIO: ${{ inputs.fio }}
          CHK: ${{ inputs.checker }}
          Y: ${{ inputs.year }}
          STYLE: ${{ inputs.style }}
        run: make try G="$G" M="$M" FIO="$FIO" CHK="${CHK:-Михалин С.Н.}" Y="${Y:-23}" STYLE="$STYLE"

      - name: Все студенты
        if: github.event_name == 'push' || inputs.group == ''
        run: |
          for f in students/*/variant.yaml; do
            make student S="$(basename "$(dirname "$f")")"
          done

      - name: Результаты → ветка results + сводка запуска
        if: github.ref == 'refs/heads/main'
        run: find build/ -name params.md -exec dirname {} \; | tr '\n' '\0' | xargs -0 scripts/publish.sh

      - name: Результаты → Яндекс-диск (если задан секрет YADISK_TOKEN)
        if: github.ref == 'refs/heads/main'
        continue-on-error: true   # проблемы с диском не должны валить сборку
        env:
          YADISK_TOKEN: ${{ secrets.YADISK_TOKEN }}
          YADISK_PUBLIC: ${{ vars.YADISK_PUBLIC || 'https://disk.yandex.ru/d/ai0wkudkDT9Tog' }}
        run: find build/ -name params.md -exec dirname {} \; | tr '\n' '\0' | xargs -0 python3 scripts/yadisk_upload.py

      - uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            build/
            !build/**/*.kicad_prl
          retention-days: 7
