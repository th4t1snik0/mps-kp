name: КМ-3 программы и ПЗ2

# Проверка программ КМ-3 (students/<ник>/code/prog{1,2,3}.a51) и ПЗ2 — только Go + pandoc (+ LibreOffice для номеров
# страниц), ~1 мин. Своё: ассемблер asm51 и эмулятор 8051 emu51. Сверка с MCU 8051 IDE — джоба mide, по галочке.
#  - push: пересобираются только студенты, у которых в этом пуше поменялись code/, pz/pz2.md или pz/flow/;
#    правки генератора — только тесты (ничьи прогоны не плодятся);
#  - Actions → «КМ-3 программы и ПЗ2» → Run workflow: ник (+ номер схемы, пусто — последняя).
# Схема берётся готовая из results (СХЕМА-N студента, scripts/schema_fetch.sh): папка прогона — «ПЗ2-K по СХЕМА-N».
# Схемы ещё нет — код всё равно проверяется, папка без «по СХЕМА-N» (и предупреждение).
on:
  push:
    paths:
      - "students/*/code/**"
      - "students/*/pz/pz2.md"
      - "students/*/pz/flow/**"
      - "cmd/mpspz/**"
      - "cmd/mpscode/**"
      - "internal/**"
      - "data/**"
      - "scripts/**"
      - ".github/workflows/km3.yml"
  workflow_dispatch:
    inputs:
      student:
        description: "Ник студента — папка в students/ (make nick G=А-12 FIO=\"Рязанцев И.В.\" → a12_ryazantsev_iv)"
        required: true
      schema:
        description: "Номер схемы СХЕМА-N, по которой собирать (пусто — последняя)"
        required: false
        default: ""
      mide:
        description: "Сверить наш ассемблер с MCU 8051 IDE (apt, +1…10 мин)"
        type: boolean
        default: false

concurrency:
  group: km3-${{ github.ref }}-${{ inputs.student }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write     # комментарии в Issue студента

jobs:
  code:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    outputs:
      list: ${{ steps.who.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # для списка изменившихся студентов

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Кого собирать
        id: who
        env:
          ONLY: ${{ inputs.student }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then list="$ONLY"
          else list="$(scripts/changed_students.sh 'code/*' pz/pz2.md 'pz/flow/*' | tr '\n' ' ')"; fi
          echo "студенты: ${list:-нет (только тесты)}"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Тесты ассемблера, эмулятора, чекера и ПЗ (эталоны проходят, поломки падают)
        run: go test ./internal/asm51/ ./internal/emu51/ ./internal/codecheck/ ./internal/flow/ ./internal/pz/ ./internal/variant/

      - name: pandoc 3.11 (docx; в PDF студент сохраняет сам, когда допишет)
        if: steps.who.outputs.list != ''
        run: |
          curl -sSL -o /tmp/pandoc.deb https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-1-amd64.deb
          sudo dpkg -i /tmp/pandoc.deb >/dev/null

      - name: LibreOffice — номера страниц и PDF «просмотр» (не поставился — без них, Word допишет)
        if: steps.who.outputs.list != ''
        timeout-minutes: 3
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libreoffice-writer-nogui poppler-utils fonts-liberation >/dev/null

      - name: Программы и ПЗ2
        id: students
        if: steps.who.outputs.list != ''
        env:
          LIST: ${{ steps.who.outputs.list }}
          SCHEMA: ${{ inputs.schema }}
        run: |
          go build -o bin/mpsgen ./cmd/mpsgen && go build -o bin/mpscode ./cmd/mpscode && go build -o bin/mpspz ./cmd/mpspz
          status=0
          for s in $LIST; do
            echo "::group::$s"
            f="students/$s/variant.yaml"
            if ! ls students/"$s"/code/prog[123].a51 >/dev/null 2>&1; then echo "::warning::$s: нет students/$s/code/prog*.a51 — make code-init S=$s"; echo "::endgroup::"; continue; fi
            scripts/schema_fetch.sh "$s" "$SCHEMA" --optional || { status=1; echo "::endgroup::"; continue; }
            bin/mpscode -student "$f" || status=1
            bin/mpspz -student "$f" -doc pz2 || echo "::warning::ПЗ2 для $s не собралась"
            echo "::endgroup::"
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Результаты → ветка results
        if: github.ref == 'refs/heads/main' && steps.who.outputs.list != ''
        env:
          SUMMARY: "0"   # сводку уже написал mpscode
          RUN_KIND: ПЗ2   # папка «ПЗ2-K по СХЕМА-N»: записка ПЗ2 + программы/
        run: find build/ -name .dest -exec dirname {} \; | tr '\n' '\0' | xargs -0 -r scripts/publish.sh

      - run: mkdir -p build && touch build/.root   # корень артефакта — build/ (иначе срежется префикс <группа>/<M>)
      - uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true   # build/…/.pub, .run, .pubdest — готовая папка прогона для диска
          name: code
          path: |
            build/**/code/
            build/**/pz2/
            build/**/.pub/
            build/**/.run
            build/**/.pubdest
            build/**/.nick
            build/**/.send
            build/.root
          retention-days: 7

      - name: Ошибка → комментарий в Issue студента
        if: failure() && steps.who.outputs.list != ''
        env:
          GH_TOKEN: ${{ github.token }}
          LIST: ${{ steps.who.outputs.list }}
        run: python3 scripts/issue_notify.py fail $LIST

      - name: Итог по студентам
        if: steps.students.outputs.status == '1'
        run: |
          echo "::error::в программах студентов есть ❌ (или нет схемы) — отчёт на странице запуска (Summary) и в build/<группа>/<M>/code/report.md"
          exit 1

  mide:
    # вторая сборка эталонов и программ студентов MCU 8051 IDE — байты должны совпасть с asm51
    if: github.event_name == 'workflow_dispatch' && inputs.mide
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: MCU 8051 IDE
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends mcu8051ide
      - name: Сверка asm51 с MCU 8051 IDE
        run: |
          go build -o bin/mpscode ./cmd/mpscode
          r=internal/codecheck/testdata/ref
          bin/mpscode -outroot build-ref -group А-12 -m 14 -nosim $r/prog1.a51 $r/prog2r.a51 $r/prog3y2.a51 >/dev/null || true
          bin/mpscode -outroot build-ref -group А-12 -m 15 -nosim $r/prog2w.a51 $r/prog3ind.a51 >/dev/null || true
          bin/mpscode -outroot build-ref -group А-17 -m 16 -nosim $r/prog3y1.a51 >/dev/null || true
          for f in students/*/variant.yaml; do
            ls "$(dirname "$f")"/code/prog[123].a51 >/dev/null 2>&1 && bin/mpscode -nosim -student "$f" >/dev/null || true
          done
          scripts/mide_crosscheck.sh build build-ref

  # Яндекс-диск — отдельной джобой: результаты в ветке results уже опубликованы основной, а загрузка на диск
  # (с ожиданием блокировок, когда КМ-1/2/3 пишут одновременно) не задерживает её.
  yadisk:
    needs: code
    if: always() && github.ref == 'refs/heads/main' && needs.code.outputs.list != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: code
          path: build
      - name: Результаты → Яндекс-диск (если задан секрет YADISK_TOKEN)
        env:
          YADISK_TOKEN: ${{ secrets.YADISK_TOKEN }}
          YADISK_PUBLIC: ${{ vars.YADISK_PUBLIC || 'https://disk.yandex.ru/d/ai0wkudkDT9Tog' }}
        run: find build/ -mindepth 3 -maxdepth 3 -type d -name .pub -exec dirname {} \; | tr '\n' '\0' | xargs -0 -r python3 scripts/yadisk_upload.py
      - name: Комментарий в Issue студента (если ведётся через Issue)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          YADISK_PUBLIC: ${{ vars.YADISK_PUBLIC || 'https://disk.yandex.ru/d/ai0wkudkDT9Tog' }}
        run: find build/ -mindepth 3 -maxdepth 3 -type d -name .pub -exec dirname {} \; | tr '\n' '\0' | xargs -0 -r python3 scripts/issue_notify.py ok
