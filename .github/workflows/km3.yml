name: КМ-3 программы и ПЗ2

# Проверка программ КМ-3 (students/<ник>/code/prog{1,2,3}.a51) — только Go: свой ассемблер (asm51) и эмулятор 8051 (emu51),
# ничего не ставится, прогон ~1 мин. Сверка ассемблера с MCU 8051 IDE — отдельная джоба mide, по кнопке (галочка в Run workflow).
#  - push: если менялись программы студентов, чекер, шаблоны или таблица;
#  - Actions → code → Run workflow: можно указать ник (пусто — все студенты).
# Что делает: тесты чекера на эталонах; mpscode по каждому студенту;
# результаты (файлы для робота «Фамилия ИО-код-n.txt», отчёт) — в ветку results (<группа>/<M>/code/), на Яндекс-диск и в артефакт.
on:
  push:
    paths:
      - "students/*/variant.yaml"
      - "students/*/code/**"
      - "students/*/pz/pz2.md"
      - "students/*/pz/flow/**"
      - "cmd/mpspz/**"
      - "internal/pz/**"
      - "internal/flow/**"
      - "cmd/mpscode/**"
      - "internal/asm51/**"
      - "internal/emu51/**"
      - "internal/codecheck/**"
      - "internal/variant/**"
      - "internal/render/**"
      - "data/**"
      - "scripts/mide_crosscheck.sh"
      - "scripts/publish.sh"
      - ".github/workflows/km3.yml"
  workflow_dispatch:
    inputs:
      student:
        description: "Ник студента (папка в students/); пусто — все"
        required: false
        default: ""
      mide:
        description: "Сверить наш ассемблер с MCU 8051 IDE (apt, +1…10 мин)"
        type: boolean
        default: false

concurrency:
  group: km3-${{ github.ref }}-${{ inputs.student }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  code:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: pandoc 3.11 (docx; в PDF студент сохраняет сам, когда допишет)
        run: |
          curl -sSL -o /tmp/pandoc.deb https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-1-amd64.deb
          sudo dpkg -i /tmp/pandoc.deb >/dev/null

      - name: LibreOffice — номера страниц в содержании (не поставился — содержание без номеров, Word допишет)
        timeout-minutes: 3
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libreoffice-writer-nogui poppler-utils fonts-liberation >/dev/null

      - name: Тесты ассемблера, эмулятора, чекера и ПЗ (эталоны проходят, поломки падают)
        run: go test ./internal/asm51/ ./internal/emu51/ ./internal/codecheck/ ./internal/flow/ ./internal/pz/

      - name: Сборка mpscode
        run: go build -o bin/mpscode ./cmd/mpscode

      - name: Программы студентов
        id: students
        env:
          ONLY: ${{ inputs.student }}
        run: |
          status=0
          for f in students/*/variant.yaml; do
            s="$(basename "$(dirname "$f")")"
            [ -n "$ONLY" ] && [ "$s" != "$ONLY" ] && continue
            ls students/"$s"/code/prog[123].a51 >/dev/null 2>&1 || continue
            echo "::group::$s"
            bin/mpscode -student "$f" || status=1
            echo "::endgroup::"
          done
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: ПЗ2 (у кого есть код)
        env:
          ONLY: ${{ inputs.student }}
        run: |
          go build -o bin/mpspz ./cmd/mpspz
          for f in students/*/variant.yaml; do
            s="$(basename "$(dirname "$f")")"
            [ -n "$ONLY" ] && [ "$s" != "$ONLY" ] && continue
            ls students/"$s"/code/prog[123].a51 >/dev/null 2>&1 || continue
            echo "::group::$s"
            bin/mpspz -student "$f" -doc pz2 || echo "::warning::ПЗ2 для $s не собралась"
            echo "::endgroup::"
          done
          ls build/*/*/pz2/ 2>/dev/null || true

      - name: Результаты → ветка results
        if: github.ref == 'refs/heads/main'
        env:
          SUMMARY: "0"   # сводку уже написал mpscode
          RUN_KIND: ПЗ2   # папка ПЗ2-N: записка ПЗ2 + программы/
        run: find build/ -mindepth 3 -maxdepth 3 -type d \( -name code -o -name pz2 \) -exec dirname {} \; | sort -u | tr '\n' '\0' | xargs -0 -r scripts/publish.sh

      - run: touch build/.root   # корень артефакта — build/ (иначе при одном студенте срежется префикс <группа>/<M>)
      - uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true   # build/…/.pub и .run — готовая папка прогона для диска
          name: code
          path: |
            build/**/code/
            build/**/pz2/
            build/**/.pub/
            build/**/.run
            build/.root
          retention-days: 7

      - name: Итог по студентам
        if: steps.students.outputs.status != '0'
        run: |
          echo "::error::в программах студентов есть ❌ — отчёт на странице запуска (Summary) и в build/<группа>/<M>/code/report.md"
          exit 1

  mide:
    # вторая сборка эталонов и программ студентов MCU 8051 IDE — байты должны совпасть с asm51
    if: github.event_name == 'workflow_dispatch' && inputs.mide
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: MCU 8051 IDE
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends mcu8051ide
      - name: Сверка asm51 с MCU 8051 IDE
        run: |
          go build -o bin/mpscode ./cmd/mpscode
          r=internal/codecheck/testdata/ref
          bin/mpscode -outroot build-ref -group А-12 -m 14 -nosim $r/prog1.a51 $r/prog2r.a51 $r/prog3y2.a51 >/dev/null || true
          bin/mpscode -outroot build-ref -group А-12 -m 15 -nosim $r/prog2w.a51 $r/prog3ind.a51 >/dev/null || true
          bin/mpscode -outroot build-ref -group А-17 -m 16 -nosim $r/prog3y1.a51 >/dev/null || true
          for f in students/*/variant.yaml; do
            ls "$(dirname "$f")"/code/prog[123].a51 >/dev/null 2>&1 && bin/mpscode -nosim -student "$f" >/dev/null || true
          done
          scripts/mide_crosscheck.sh build build-ref

  # Яндекс-диск — отдельной джобой: результаты в ветке results уже опубликованы основной, а загрузка на диск
  # (с ожиданием блокировок, когда КМ-1/2/3 пишут одновременно) не задерживает её.
  yadisk:
    needs: code
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: code
          path: build
      - name: Результаты → Яндекс-диск (если задан секрет YADISK_TOKEN)
        env:
          YADISK_TOKEN: ${{ secrets.YADISK_TOKEN }}
          YADISK_PUBLIC: ${{ vars.YADISK_PUBLIC || 'https://disk.yandex.ru/d/ai0wkudkDT9Tog' }}
        run: find build/ -mindepth 3 -maxdepth 3 -type d -name .pub -exec dirname {} \; | tr '\n' '\0' | xargs -0 -r python3 scripts/yadisk_upload.py
