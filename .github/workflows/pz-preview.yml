name: ПЗ превью (страницы картинками)

# Для проверки вёрстки ПЗ: собирает docx студента, рендерит LibreOffice → PDF → PNG постранично + обзорный лист.
# Только по кнопке (Actions → «ПЗ превью» → Run workflow): LibreOffice ставится ~1–2 мин, в основные джобы не входит.
on:
  workflow_dispatch:
    inputs:
      student:
        description: "Ник студента (папка в students/)"
        required: true
        default: "a12_ryazantsev_iv"
      doc:
        description: "pz1 | pz2"
        required: true
        default: "pz2"

jobs:
  preview:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: pandoc, LibreOffice, poppler, шрифты (Liberation — метрики Times New Roman / Arial)
        run: |
          curl -sSL -o /tmp/pandoc.deb https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-1-amd64.deb
          sudo dpkg -i /tmp/pandoc.deb >/dev/null
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libreoffice-writer-nogui poppler-utils fonts-liberation >/dev/null
          if [ "${{ inputs.doc }}" = pz1 ]; then
            sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases >/dev/null
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends kicad >/dev/null
            mkdir -p ~/.fonts && cp fonts/*.ttf ~/.fonts/ && fc-cache -f
          fi
      - name: Сборка и рендер
        env:
          S: ${{ inputs.student }}
          DOC: ${{ inputs.doc }}
        run: |
          go build -o bin/mpspz ./cmd/mpspz
          [ "$DOC" = pz1 ] && make student S="$S" >/dev/null
          mkdir -p preview
          for st in A B C; do
            bin/mpspz -student "students/$S/variant.yaml" -doc "$DOC" -style $st >/dev/null
            pdf="$(ls build/*/*/$DOC/*просмотр.pdf | head -1)"   # mpspz сам рендерит LibreOffice’ом (номера страниц + PDF)
            mkdir -p preview/$st
            pdftoppm -r 70 -png "$pdf" preview/$st/p
            go run ./scripts/montage 6 preview/sheet-$st.png "preview/$st/p-*.png"
            cp "$pdf" "preview/$DOC-$st.pdf"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: preview
          path: preview/
          retention-days: 3
