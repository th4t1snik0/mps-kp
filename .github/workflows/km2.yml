name: КМ-2 ПЗ1

# ПЗ1 «Аппаратная часть» в docx: генерируемое (структурная и функциональная схемы, фрагменты Э3 по узлам, расчёты
# с номиналами из перечня, таблицы выводов/адресов/кодов, временные диаграммы, перечень, Э3 в приложении) + текст студента
# из students/<ник>/pz/pz1.md (места «ДОПИШИ»).
# Схема НЕ строится заново: берётся сданная СХЕМА-N из results (scripts/schema_fetch.sh) — рисунки, перечень и дата
# в ПЗ1 те же, что в схеме. Папка прогона — «ПЗ1-K по СХЕМА-N». Схемы нет или variant.yaml с тех пор поменялся — ошибка
# с подсказкой «прогони КМ-1». KiCad не нужен (~1 мин).
#  - push: только студенты, у которых в этом пуше поменялся pz/pz1.md; правки генератора — только тесты;
#  - Actions → «КМ-2 ПЗ1» → Run workflow: ник (+ номер схемы, пусто — последняя).
on:
  push:
    paths:
      - "students/*/pz/pz1.md"
      - "cmd/mpspz/**"
      - "internal/pz/**"
      - "internal/diag/**"
      - "internal/variant/**"
      - "scripts/**"
      - ".github/workflows/km2.yml"
  workflow_dispatch:
    inputs:
      student:
        description: "Ник студента — папка в students/ (make nick G=А-12 FIO=\"Рязанцев И.В.\" → a12_ryazantsev_iv)"
        required: true
      schema:
        description: "Номер схемы СХЕМА-N, по которой собирать ПЗ1 (пусто — последняя)"
        required: false
        default: ""

concurrency:
  group: km2-${{ github.ref }}-${{ inputs.student }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write     # комментарии в Issue студента

jobs:
  pz1:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    outputs:
      list: ${{ steps.who.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # для списка изменившихся студентов
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Кого собирать
        id: who
        env:
          ONLY: ${{ inputs.student }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then list="$ONLY"
          else list="$(scripts/changed_students.sh pz/pz1.md | tr '\n' ' ')"; fi
          echo "студенты: ${list:-нет (только тесты)}"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: Тесты ПЗ
        run: go test ./internal/pz/ ./internal/variant/

      - name: pandoc 3.11, шрифты
        if: steps.who.outputs.list != ''
        run: |
          curl -sSL -o /tmp/pandoc.deb https://github.com/jgm/pandoc/releases/download/3.11/pandoc-3.11-1-amd64.deb
          sudo dpkg -i /tmp/pandoc.deb >/dev/null
          mkdir -p ~/.fonts && cp fonts/*.ttf ~/.fonts/ && fc-cache -f

      - name: LibreOffice — номера страниц и PDF «просмотр» (не поставился — без них, Word допишет)
        if: steps.who.outputs.list != ''
        timeout-minutes: 3
        continue-on-error: true
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends libreoffice-writer-nogui poppler-utils fonts-liberation >/dev/null

      - name: ПЗ1 по сданной схеме
        if: steps.who.outputs.list != ''
        env:
          LIST: ${{ steps.who.outputs.list }}
          SCHEMA: ${{ inputs.schema }}
        run: |
          go build -o bin/mpsgen ./cmd/mpsgen && go build -o bin/mpspz ./cmd/mpspz
          status=0
          for s in $LIST; do
            echo "::group::$s"
            if scripts/schema_fetch.sh "$s" "$SCHEMA"; then
              bin/mpspz -student "students/$s/variant.yaml" -doc pz1 || { echo "::error::ПЗ1 для $s не собралась"; status=1; }
            else status=1; fi
            echo "::endgroup::"
          done
          exit $status

      - name: Результаты → ветка results
        if: always() && github.ref == 'refs/heads/main' && steps.who.outputs.list != ''
        env:
          RUN_KIND: ПЗ1   # папка «ПЗ1-K по СХЕМА-N»
        run: find build/ -name .dest -exec dirname {} \; | tr '\n' '\0' | xargs -0 -r scripts/publish.sh

      - run: mkdir -p build && touch build/.root   # корень артефакта — build/ (иначе срежется префикс <группа>/<M>)
        if: always()
      - uses: actions/upload-artifact@v4
        if: always() && steps.who.outputs.list != ''
        with:
          include-hidden-files: true   # build/…/.pub, .run, .pubdest — готовая папка прогона для диска
          name: pz1
          path: |
            build/**/pz1/
            build/**/.pub/
            build/**/.run
            build/**/.pubdest
            build/**/.nick
            build/.root
          retention-days: 7

      - name: Ошибка → комментарий в Issue студента
        if: failure() && steps.who.outputs.list != ''
        env:
          GH_TOKEN: ${{ github.token }}
          LIST: ${{ steps.who.outputs.list }}
        run: python3 scripts/issue_notify.py fail $LIST

  # Яндекс-диск — отдельной джобой: результаты в ветке results уже опубликованы основной, а загрузка на диск
  # (с ожиданием блокировок, когда КМ-1/2/3 пишут одновременно) не задерживает её.
  yadisk:
    needs: pz1
    if: always() && github.ref == 'refs/heads/main' && needs.pz1.outputs.list != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: pz1
          path: build
      - name: Результаты → Яндекс-диск (если задан секрет YADISK_TOKEN)
        env:
          YADISK_TOKEN: ${{ secrets.YADISK_TOKEN }}
          YADISK_PUBLIC: ${{ vars.YADISK_PUBLIC || 'https://disk.yandex.ru/d/ai0wkudkDT9Tog' }}
        run: find build/ -mindepth 3 -maxdepth 3 -type d -name .pub -exec dirname {} \; | tr '\n' '\0' | xargs -0 -r python3 scripts/yadisk_upload.py
      - name: Комментарий в Issue студента (если ведётся через Issue)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          YADISK_PUBLIC: ${{ vars.YADISK_PUBLIC || 'https://disk.yandex.ru/d/ai0wkudkDT9Tog' }}
        run: find build/ -mindepth 3 -maxdepth 3 -type d -name .pub -exec dirname {} \; | tr '\n' '\0' | xargs -0 -r python3 scripts/issue_notify.py ok
