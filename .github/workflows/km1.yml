name: КМ-1 схема и перечень

# Схема Э3 и перечень студента — из students/<ник>/variant.yaml (единственный источник: группа, M, ФИО, стиль).
#  - push: пересобираются только студенты, у которых в этом пуше поменялся variant.yaml (или правки схемы);
#    правки генератора — только тесты (ничьи прогоны не плодятся);
#  - Actions → «КМ-1 схема и перечень» → Run workflow: ник → новая СХЕМА-N в results/<группа>/<M> <ФИО>/ и на диске.
# Посмотреть любой вариант без папки студента — джоба «Проба варианта» (пишет в _пробы/, не в сдачу).
on:
  push:
    paths:
      - "cmd/**"
      - "internal/**"
      - "data/**"
      - "masters/**"
      - "students/*/variant.yaml"
      - "students/*/schema/**"
      - "fonts/**"
      - "scripts/**"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/km1.yml"
  workflow_dispatch:
    inputs:
      student:
        description: "Ник студента — папка в students/ (make nick G=А-12 FIO=\"Рязанцев И.В.\" → a12_ryazantsev_iv)"
        required: true
      next:
        description: "После схемы собрать и ПЗ1 (КМ-2), и программы + ПЗ2 (КМ-3) по ней"
        type: boolean
        default: false

# новый пуш отменяет ещё идущий прогон той же ветки; запуски Run workflow с разными вариантами не мешают друг другу
concurrency:
  group: km1-${{ github.ref }}-${{ github.event_name }}-${{ inputs.student }}
  cancel-in-progress: true

permissions:
  contents: write   # публикация результатов в ветку results
  issues: write     # комментарии в Issue студента
  actions: write    # КМ-1 с next запускает КМ-2/КМ-3

jobs:
  build:
    runs-on: ubuntu-24.04
    outputs:
      list: ${{ steps.who.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # для списка изменившихся студентов

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Кого собирать
        id: who
        env:
          ONLY: ${{ inputs.student }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            [ -f "students/$ONLY/variant.yaml" ] || { echo "::error::нет students/$ONLY/variant.yaml — ник это имя папки (make nick G=… FIO=…)"; exit 1; }
            list="$ONLY"
          else list="$(scripts/changed_students.sh variant.yaml 'schema/*' | tr '\n' ' ')"; fi
          echo "студенты: ${list:-нет (только тесты)}"
          echo "list=$list" >> "$GITHUB_OUTPUT"

      - name: KiCad 10 + poppler + шрифт ГОСТ
        run: |
          sudo add-apt-repository -y ppa:kicad/kicad-10.0-releases
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends kicad poppler-utils
          mkdir -p ~/.fonts && cp fonts/*.ttf ~/.fonts/ && fc-cache -f

      - name: Тесты
        run: go test ./...

      - name: Схемы студентов
        if: steps.who.outputs.list != ''
        env:
          LIST: ${{ steps.who.outputs.list }}
        run: for s in $LIST; do make student S="$s"; done

      - name: Результаты → ветка results + сводка запуска
        if: github.ref == 'refs/heads/main' && steps.who.outputs.list != ''
        env:
          RUN_KIND: СХЕМА   # папка СХЕМА-N
        run: find build/ -name meta.json -exec dirname {} \; | tr '\n' '\0' | xargs -0 -r scripts/publish.sh

      - name: Дальше по новой схеме — КМ-2 и КМ-3 (next)
        if: github.ref == 'refs/heads/main' && inputs.next
        env:
          GH_TOKEN: ${{ github.token }}
          S: ${{ inputs.student }}
        run: |
          [ -f "students/$S/pz/pz1.md" ] && gh workflow run km2.yml --ref main -f student="$S" || echo "ПЗ1 ещё не начата — КМ-2 не запускаю"
          ls students/"$S"/code/prog[123].a51 >/dev/null 2>&1 && gh workflow run km3.yml --ref main -f student="$S" || echo "программ ещё нет — КМ-3 не запускаю"

      - uses: actions/upload-artifact@v4
        if: steps.who.outputs.list != ''
        with:
          include-hidden-files: true   # build/…/.pub, .run, .pubdest — готовая папка прогона для диска
          name: build
          path: |
            build/
            !build/**/*.kicad_prl
          retention-days: 7

      - name: Ошибка → комментарий в Issue студента
        if: failure() && steps.who.outputs.list != ''
        env:
          GH_TOKEN: ${{ github.token }}
          LIST: ${{ steps.who.outputs.list }}
        run: python3 scripts/issue_notify.py fail $LIST

  # Яндекс-диск — отдельной джобой: результаты в ветке results уже опубликованы основной, а загрузка на диск
  # (с ожиданием блокировок, когда КМ-1/2/3 пишут одновременно) не задерживает её.
  yadisk:
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.list != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: build
          path: build
      - name: Результаты → Яндекс-диск (если задан секрет YADISK_TOKEN)
        env:
          YADISK_TOKEN: ${{ secrets.YADISK_TOKEN }}
          YADISK_PUBLIC: ${{ vars.YADISK_PUBLIC || 'https://disk.yandex.ru/d/ai0wkudkDT9Tog' }}
        run: find build/ -mindepth 3 -maxdepth 3 -type d -name .pub -exec dirname {} \; | tr '\n' '\0' | xargs -0 -r python3 scripts/yadisk_upload.py
      - name: Комментарий в Issue студента (если ведётся через Issue)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          YADISK_PUBLIC: ${{ vars.YADISK_PUBLIC || 'https://disk.yandex.ru/d/ai0wkudkDT9Tog' }}
        run: find build/ -mindepth 3 -maxdepth 3 -type d -name .pub -exec dirname {} \; | tr '\n' '\0' | xargs -0 -r python3 scripts/issue_notify.py ok
