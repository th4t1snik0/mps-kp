# Таблица 1 из ТЗ «МПС ч.2», 2025 год.
# Когда выйдет новое ТЗ — скопировать файл в table-<год>.yaml и поправить числа.
# Формулы вида «X + 10M» записываются как {base: X, per_m: 10}.
