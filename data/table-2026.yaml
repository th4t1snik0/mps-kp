# Таблица 1 из ТЗ «МПС ч.2», 2026 год (docs/source/ТЗ-2026.pdf, с. 3; разбор — docs/research/tz-2026.md).
# CS — номер выхода дешифратора 74HC138 (Yn): A0/A1/A2 ← A13/A14/A15, E2 ← CS_EN (P3.4), базовый адрес = n·2000h.
# Где CS зависит от чётности M — {even: …, odd: …} («для четных / нечет. M» в ТЗ).
# Формулы «X + 10M» — {base: X, per_m: 10}; T3 «2.10+M/20 с» — {base: 2100, per_m: 50} мс.
# Таймеры и прерывания в 2026 общие: T1, T3 — таймер 0, T2 — таймер 1; клавиатура — INT0, X2 — INT1.
# Флаги: пустота — бит M, переполнение — бит M+G (G — номер группы).

year: 2026
crystal_mhz: 12
x2_max_rate_per_s: 4        # «до 4 отсчетов в секунду»
cs_mode: decoder
cs_en_pin: P3.4
filter_cap: 33 н            # «керамический конденсатор 33 нФ на каждый корпус» (п. 2.1(10))

groups:
  А-06:
    g: 6
    t1_ms:     {base: 166, per_m: 10}
    cs_buf:    Y1
    v_bytes:   {base: 1200, per_m: 10}
    head_addr: 0x38
    tail_addr: 0x3A
    empty_bit: {base: 0, per_m: 1}
    ovf_bit:   {base: 6, per_m: 1}
    cs_y2:     {even: Y2, odd: Y3}
    t2_us:     {base: 1506, per_m: 30}
    cs_ind:    {even: Y3, odd: Y2}
    t3_ms:     {base: 2100, per_m: 50}
    indicator: cathode
    cs_kb:     Y4
    kb_int:    INT0
    y1_timer:  0
    y2_timer:  1
    t3_timer:  0

